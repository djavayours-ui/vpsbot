<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>VPS Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>

<header>
  <div class="hd">
    <h1 id="ttl">Holat</h1>
    <div class="sub"><i class="dot" id="ld"></i><span id="up">Ulanmoqda…</span></div>
  </div>
  <div class="hbtns">
    <button class="ib" id="rf" aria-label="Yangilash">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
</header>

<div class="err g" id="er"></div>

<main>
  <!-- ══════ HOLAT ══════ -->
  <section class="v on" id="v-st">
    <div class="g hero">
      <div class="ring">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7F888F"/><stop offset=".55" stop-color="#F2F5F8"/><stop offset="1" stop-color="#A9CCE3"/>
            </linearGradient>
            <linearGradient id="sg2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#B99A7A"/><stop offset="1" stop-color="#F0D3AF"/>
            </linearGradient>
          </defs>
          <circle class="t" cx="100" cy="100" r="86"/>
          <circle class="f" id="rg" cx="100" cy="100" r="86"/>
        </svg>
        <div class="c"><b><span id="cpu">–</span><small>%</small></b><span>Protsessor</span></div>
      </div>
      <div class="sparkset" id="spark"></div>
      <p class="note" id="cn"></p>
    </div>

    <div class="g m" id="mt"></div>

    <div class="two">
      <div class="g mini"><small>Tarmoq ↓</small><b id="rx">—</b><em id="nett">jami</em></div>
      <div class="g mini"><small>Tarmoq ↑</small><b id="tx">—</b><em id="nett2">jami</em></div>
      <div class="g mini"><small>Harorat</small><b id="tp">—</b><em>CPU</em></div>
      <div class="g mini"><small>Yuklama</small><b id="la">—</b><em>1 · 5 · 15</em></div>
    </div>

    <div class="g panel">
      <div class="ph"><h3>Eng og'ir jarayonlar</h3><button class="lnk" data-tab="pr">Barchasi</button></div>
      <div id="toplist" class="lst"></div>
    </div>
  </section>

  <!-- ══════ ILOVALAR ══════ -->
  <section class="v" id="v-ap">
    <div class="apbar">
      <button class="btn sm" id="deployBtn">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        ZIP yuklash
      </button>
      <input type="file" id="zipInput" accept=".zip" hidden>
    </div>
    <div id="appsList" class="lst vlist"></div>
  </section>

  <!-- ══════ JARAYONLAR ══════ -->
  <section class="v" id="v-pr">
    <div class="seg" id="prSeg">
      <button class="on" data-sort="cpu">CPU</button>
      <button data-sort="mem">RAM</button>
    </div>
    <div id="procList" class="lst"></div>
  </section>

  <!-- ══════ FAYLLAR ══════ -->
  <section class="v" id="v-fl">
    <div class="crumbs" id="crumb"></div>
    <div class="fbar">
      <button class="btn sm" id="upBtn">Yuklash</button>
      <button class="btn sm" id="mkdirBtn">Yangi papka</button>
      <input type="file" id="fileInput" hidden multiple>
    </div>
    <div id="fileList" class="lst"></div>
  </section>

  <!-- ══════ KO'PROQ ══════ -->
  <section class="v" id="v-mo">
    <div class="grid2">
      <button class="g tile" data-more="svc"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.2 0 1.7 1.7 0 0 0-.6 1.3V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 0-2.2 1.7 1.7 0 0 0-1.3-.6H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9.6A1.7 1.7 0 0 0 10.7 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 .6 1.3 1.7 1.7 0 0 0 1.9.3h.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1.1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.1z"/></svg><span>Xizmatlar</span></button>
      <button class="g tile" data-more="docker"><svg class="i" viewBox="0 0 24 24"><path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-3z"/><path d="M7 12V8h3v4M11 12V8h3v4M15 12V8h3v4M7 5h3"/></svg><span>Docker</span></button>
      <button class="g tile" data-more="disk"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="6" rx="2"/><rect x="3" y="13" width="18" height="6" rx="2"/><path d="M7 8h.01M7 16h.01"/></svg><span>Disk</span></button>
      <button class="g tile" data-more="ports"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg><span>Portlar</span></button>
      <button class="g tile" data-more="term"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><span>Terminal</span></button>
      <button class="g tile danger" data-more="reboot"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg><span>Reboot</span></button>
    </div>
    <div class="g panel" id="quickPanel"></div>
    <div class="g panel">
      <div class="ph"><h3>Menyu</h3></div>
      <div class="kvgrid" id="meInfo"></div>
    </div>
  </section>
</main>

<nav class="g" id="nav">
  <button class="on" data-tab="st">
    <svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 5 14 2.5-7h4"/></svg><span>Holat</span></button>
  <button data-tab="ap">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span>Ilovalar</span></button>
  <button data-tab="pr">
    <svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg><span>Jarayon</span></button>
  <button data-tab="fl">
    <svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span>Fayllar</span></button>
  <button data-tab="mo">
    <svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>Ko'proq</span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet g" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
